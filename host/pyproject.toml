[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jstack-host"
version = "0.1.0"
description = "The jStack host — the API a phone, a Mac or another machine reaches this one through"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime deps only, unpinned by minor. The host used to ship as a folder of
# 27 pre-downloaded wheels because there was no public URL to install from;
# there is one now, so resolution is pip's job again.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "wsproto>=1.2",
    "httpx>=0.27",
    "psutil>=6.0",
    "pydantic>=2.8",
    "PyJWT>=2.9",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jstack-host = "jstack_host.cli:main"
jstack-update-bootstrap = "jstack_host.install_updater:main"
jstack-release = "jstack_host.publish_release:main"

[tool.setuptools.package-data]
jstack_host = ["release-trust.json"]

[tool.setuptools.packages.find]
include = ["jstack_host*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
